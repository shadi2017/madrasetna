name: Keep Supabase awake

# Supabase Free pauses projects after 7 days without activity.
# A tiny daily read keeps the project active during school holidays.
# This uses only the public anon key and the public settings row.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Supabase repository variables are not configured; skipping."
            exit 0
          fi
          SUPABASE_URL="${SUPABASE_URL%/}"
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            "$SUPABASE_URL/rest/v1/settings?select=id&id=eq.1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" > /dev/null
          echo "Supabase is awake."
